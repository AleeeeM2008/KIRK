[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirk"
version = "0.1.0"
description = "Glass-box distilled SPOCK and a cost-aware N-body scheduler"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "GPL-3.0-only"}
dependencies = [
    "numpy",
    "rebound==4.6.0",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]
data = ["pandas", "matplotlib"]
spock = [
    "rebound==4.6.0",
    "reboundx==4.6.2",
    "spock==2.1.1",
    "celmech",
    "pandas",
    "h5py",
    "einops",
    "xgboost==2.1.4",
    "scikit-learn==1.5.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
